[package]
name = "tree-sitter-csv"
description = "for syntax highlighting"
version = "2.0.0"
authors = ["Hans", "Lennard Hofmann"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "csv"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/ordoviz/tree-sitter-csv"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.9"
